name: CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_id || 'cancelable' }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

env:
  OCAML_COMPILER: 5.1.1
  JACQUARD_PRELUDE: ${{ github.workspace }}/prelude
  TMPDIR: ${{ github.workspace }}/.scratch/tmp

jobs:
  development-gate:
    name: Development gate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Prepare temporary storage
        run: |
          mkdir -p "$TMPDIR"
          scripts/check-temp-policy.sh

      - name: Test dependency-install retry policy
        run: scripts/ci/test-opam-install-deps.sh

      - name: Verify historical release manifests
        run: |
          scripts/release/check-historical-manifests.sh \
            --commit "$GITHUB_SHA" \
            --require-history
          scripts/release/test-historical-manifests.sh --commit "$GITHUB_SHA"

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3.6.1
        with:
          ocaml-compiler: ${{ env.OCAML_COMPILER }}

      - name: Install dependencies
        run: |
          scripts/ci/opam-install-deps.sh \
            --deps-only . --with-test --with-doc --with-dev-setup -y

      - name: Build
        run: opam exec -- dune build @all

      - name: Full test suite
        run: opam exec -- dune runtest

      - name: Release installer smoke
        run: scripts/release/smoke-installer.sh linux-x86_64

      - name: Check formatting
        run: |
          opam exec -- dune fmt
          git diff --exit-code

      - name: Version smoke
        run: _build/default/bin/main.exe --version

      - name: Release evidence files exist
        run: |
          test -x scripts/release/reproduce-0.1.sh
          test -x scripts/release/reproduce-0.2.sh
          test -x scripts/release/check-0.2-manifest.sh
          test -f docs/release/0.1/EVIDENCE.md
          test -f docs/release/0.1/CLAIMS.md
          test -f docs/release/0.1/REPRO.md
          test -f docs/release/0.1/RELEASE-NOTES.md
          test -f docs/release/0.2/EVIDENCE.md
          test -f docs/release/0.2/CLAIMS.md
          test -f docs/release/0.2/REPRO.md
          test -f docs/release/0.2/RELEASE-NOTES.md
          test -f docs/release/0.2/LIMITS.md
          test -f docs/release/0.2/MANIFEST.sha256
          test -x scripts/release/smoke-installer.sh

  native-parity:
    name: Native parity (${{ matrix.cc }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cc: [clang, gcc]
    env:
      CC: ${{ matrix.cc }}
      JACQUARD_RUNTIME: ${{ github.workspace }}/runtime

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Prepare temporary storage
        run: mkdir -p "$TMPDIR"

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3.6.1
        with:
          ocaml-compiler: ${{ env.OCAML_COMPILER }}

      - name: Install dependencies
        run: |
          scripts/ci/opam-install-deps.sh \
            --deps-only . --with-test -y

      - name: Build
        run: opam exec -- dune build @all

      - name: Runtime memory gate (ASAN/UBSAN)
        run: runtime/check.sh

      - name: Differential harness (both engines, byte-compared)
        run: opam exec -- sh scripts/native-diff.sh

      - name: Leak battery (gauntlet under ASAN)
        run: opam exec -- sh scripts/native-leak-check.sh

      - name: Fuzz lane (1000 seeded cases)
        run: opam exec -- dune build @native-fuzz
