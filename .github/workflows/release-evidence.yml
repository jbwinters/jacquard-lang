name: Release Evidence

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to reproduce"
        required: false
        default: "main"
      base:
        description: "Candidate base commit that must be an ancestor"
        required: false
        default: "f296ec1333072a1bdddb53f707eef836926cdb43"
  push:
    branches:
      - "release/**"
    tags:
      - "jacquard-core-*"

permissions:
  contents: read

# Each manual dispatch is grouped by the ref it reproduces, so dispatches of
# different candidates from one branch no longer replace each other. A newer
# push to a release branch cancels the running reproduction of the stale head;
# a cancelled run leaves no marker, so a tag on that head reproduces in full
# unless another successful release push run of the same commit left one.
# Tags and dispatches are never cancelled.
concurrency:
  group: release-evidence-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.event.inputs.ref) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') }}

env:
  OCAML_COMPILER: 5.1.1
  JACQUARD_PRELUDE: ${{ github.workspace }}/prelude
  TMPDIR: ${{ github.workspace }}/.scratch/tmp

jobs:
  # Settle exactly what is reproduced, and on a tag push whether an earlier pass
  # of that commit and base can be reused, once for the whole run.
  candidate:
    name: Identify candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.candidate.outputs.commit }}
      base: ${{ steps.candidate.outputs.base }}
      run_id: ${{ steps.prior.outputs.run_id }}

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          # a push run reproduces exactly the pushed commit, never a later
          # branch tip; a dispatch reproduces the ref it names
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Identify candidate
        id: candidate
        shell: bash
        env:
          BASE_INPUT: ${{ github.event.inputs.base || 'f296ec1333072a1bdddb53f707eef836926cdb43' }}
        run: |
          commit=$(git rev-parse HEAD)
          base=$(git rev-parse --verify "$BASE_INPUT^{commit}")
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      # A release tag reuses an earlier successful reproduction of exactly the
      # tagged commit against the same base; otherwise it reproduces in full.
      - name: Find prior evidence
        id: prior
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/jacquard-core-')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.candidate.outputs.commit }}
          BASE: ${{ steps.candidate.outputs.base }}
        run: |
          if run_id=$(scripts/release/find-prior-evidence.sh "$GITHUB_REPOSITORY" "$COMMIT" "$BASE"); then
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id"
            echo "Reusing release evidence for $COMMIT from $url" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No reusable release evidence for $COMMIT; reproducing."
          fi

  # The reproduction's independent stages run in parallel, each on exactly the
  # identified commit, and are skipped when a prior pass is reused.
  stage:
    name: Evidence stage (${{ matrix.stage }})
    needs: candidate
    if: needs.candidate.outputs.run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        stage: [core, gm12b, native-clang, native-gcc]

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ needs.candidate.outputs.commit }}

      - name: Check candidate
        env:
          COMMIT: ${{ needs.candidate.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"

      - name: Prepare temporary storage
        run: mkdir -p "$TMPDIR"

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3.6.1
        with:
          ocaml-compiler: ${{ env.OCAML_COMPILER }}

      - name: Reproduce release evidence
        env:
          COMMIT: ${{ needs.candidate.outputs.commit }}
          BASE: ${{ needs.candidate.outputs.base }}
          STAGE: ${{ matrix.stage }}
        run: |
          # A manual dispatch attests the commit it checked out, not the
          # dispatching branch tip that GITHUB_SHA names.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            GITHUB_SHA=$COMMIT
            export GITHUB_SHA
          fi
          JACQUARD_RELEASE_REF=HEAD \
          JACQUARD_RELEASE_BASE="$BASE" \
          JACQUARD_RELEASE_STAGES="$STAGE" \
          scripts/release/reproduce-0.3.sh

      - name: Upload evidence transcripts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: jacquard-release-0.3-evidence-${{ github.run_number }}-${{ matrix.stage }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            docs/release/0.3/
            docs/release/unreleased/
            .scratch/release/0.3/

  # The required check. It passes when a prior pass is reused or every stage
  # passed, and only a full pass uploads the marker a later tag push reuses. It
  # runs even in a cancelled run, so it fails there rather than being skipped:
  # a skipped job would satisfy a required check.
  reproduce:
    name: Reproduce 0.3 evidence
    needs: [candidate, stage]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Require the evidence
        env:
          CANDIDATE: ${{ needs.candidate.result }}
          RUN_ID: ${{ needs.candidate.outputs.run_id }}
          STAGES: ${{ needs.stage.result }}
          COMMIT: ${{ needs.candidate.outputs.commit }}
        run: |
          if [ "$CANDIDATE" != success ]; then
            echo "the candidate could not be identified ($CANDIDATE)" >&2
            exit 1
          fi
          if [ -n "$RUN_ID" ]; then
            echo "reused the release evidence of run $RUN_ID for $COMMIT"
            exit 0
          fi
          if [ "$STAGES" != success ]; then
            echo "release evidence stages did not all pass ($STAGES)" >&2
            exit 1
          fi
          echo "every release evidence stage passed for $COMMIT"

      - name: Write evidence marker
        if: needs.candidate.outputs.run_id == '' && needs.stage.result == 'success'
        env:
          COMMIT: ${{ needs.candidate.outputs.commit }}
          BASE: ${{ needs.candidate.outputs.base }}
        run: |
          mkdir -p .scratch/release-evidence-pass
          printf 'commit %s\nbase %s\n' "$COMMIT" "$BASE" > .scratch/release-evidence-pass/marker.txt

      - name: Upload evidence marker
        if: needs.candidate.outputs.run_id == '' && needs.stage.result == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-evidence-pass-${{ needs.candidate.outputs.commit }}-${{ needs.candidate.outputs.base }}
          if-no-files-found: error
          include-hidden-files: true
          path: .scratch/release-evidence-pass/marker.txt
